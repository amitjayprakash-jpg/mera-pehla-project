name: HTML CI/CD Pipeline

# यह पाइपलाइन तब चलेगी जब आप main ब्रांच पर कोड Push करेंगे
on:
  push:
    branches: [ "main" ]

# GitHub Pages पर वेबसाइट डालने की अनुमति दें
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. CI (Continuous Integration): कोड की गलतियां चेक करना
  check-html:
    runs-on: ubuntu-latest
    steps:
      - name: कोड डाउनलोड करें
        uses: actions/checkout@v4

      - name: HTML कोड की जांच करें (HTMLHint)
        uses: JonasKruckenberg/htmlhint-action@v1.0.0
        with:
          files: "**/*.html"

  # 2. CD (Continuous Deployment): वेबसाइट को लाइव करना
  deploy-site:
    needs: check-html # यह तभी चलेगा जब ऊपर वाला CI टेस्ट पास होगा
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: कोड डाउनलोड करें
        uses: actions/checkout@v4

      - name: GitHub Pages सेटअप करें
        uses: actions/configure-pages@v5

      - name: वेबसाइट की फाइलें अपलोड करें
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: वेबसाइट को लाइव पब्लिश करें
        id: deployment
        uses: actions/deploy-pages@v4

